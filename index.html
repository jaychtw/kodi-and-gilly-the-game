<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Kodi &amp; Gilly: Jungle Ruins</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-deep: #0b1c17;
      --panel-border: rgba(155, 212, 168, 0.28);
      --gold: #f6cc63;
      --emerald: #4fd18b;
      --coral: #ff9c8a;
      --text-main: #f4f7f1;
      --text-muted: #b8d0c1;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg-deep);
      color: var(--text-main);
      font-family: 'Inter', 'Noto Sans TC', system-ui, -apple-system, sans-serif;
    }

    .app-shell {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      position: relative;
      background: radial-gradient(circle at 50% 20%, #17382e 0%, #0b1915 100%);
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 14px;
      background: linear-gradient(180deg, rgba(8, 21, 17, 0.95) 0%, rgba(12, 28, 23, 0.86) 100%);
      border-bottom: 1px solid var(--panel-border);
      z-index: 20;
      flex-shrink: 0;
      flex-wrap: wrap;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .title-badge {
      font-family: 'Fredoka', 'Noto Sans TC', sans-serif;
      font-weight: 700;
      font-size: 1.05rem;
      letter-spacing: 0.01em;
      color: var(--gold);
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .level-pill {
      font-size: 0.82rem;
      font-weight: 600;
      color: #dff5e6;
      background: rgba(79, 209, 139, 0.14);
      border: 1px solid rgba(79, 209, 139, 0.35);
      padding: 3px 10px;
      border-radius: 999px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 240px;
    }

    .status-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .stat-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 0.82rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.14);
      white-space: nowrap;
    }

    .stat-chip.active-kodi {
      background: rgba(139, 165, 86, 0.24);
      border-color: rgba(169, 199, 108, 0.65);
      color: #e9f5c8;
    }

    .stat-chip.active-gilly {
      background: rgba(255, 156, 138, 0.24);
      border-color: rgba(255, 168, 152, 0.72);
      color: #ffe3dc;
    }

    .hud-btn {
      appearance: none;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
      font-family: inherit;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 5px 10px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.1s ease, border-color 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }

    .hud-btn:hover {
      background: rgba(255, 255, 255, 0.16);
      border-color: rgba(255, 255, 255, 0.34);
    }

    .hud-btn:active {
      transform: scale(0.96);
    }

    .stage-wrap {
      position: relative;
      flex: 1;
      width: 100%;
      min-height: 0;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #gameCanvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    .hint-banner {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(11, 27, 22, 0.82);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(246, 204, 99, 0.42);
      color: #f9f6ea;
      padding: 6px 15px;
      border-radius: 999px;
      font-size: 0.84rem;
      font-weight: 500;
      pointer-events: none;
      text-align: center;
      max-width: min(92%, 640px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.38);
      transition: opacity 0.25s ease;
      z-index: 10;
    }

    .bottom-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 14px;
      background: rgba(9, 22, 18, 0.94);
      border-top: 1px solid var(--panel-border);
      z-index: 20;
      flex-shrink: 0;
    }

    .key-legend {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .key-item {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    kbd {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-bottom-width: 2px;
      border-radius: 5px;
      padding: 1px 6px;
      font-family: inherit;
      font-size: 0.74rem;
      font-weight: 700;
      color: #fff;
    }

    .touch-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      gap: 10px;
    }

    .dpad-group, .action-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .ctrl-btn {
      appearance: none;
      border: 1px solid rgba(255, 255, 255, 0.22);
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      font-family: inherit;
      font-weight: 700;
      font-size: 0.9rem;
      min-width: 46px;
      height: 44px;
      padding: 0 12px;
      border-radius: 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      touch-action: none;
      transition: background 0.1s ease, transform 0.08s ease;
    }

    .ctrl-btn:active, .ctrl-btn.pressed {
      background: rgba(79, 209, 139, 0.35);
      border-color: var(--emerald);
      transform: scale(0.95);
    }

    .ctrl-btn.primary-act {
      background: rgba(246, 204, 99, 0.22);
      border-color: rgba(246, 204, 99, 0.62);
      color: #ffefc2;
    }

    .ctrl-btn.swap-act {
      background: rgba(255, 156, 138, 0.2);
      border-color: rgba(255, 156, 138, 0.62);
      color: #ffe2dc;
    }

    @media (min-width: 860px) {
      .touch-controls {
        width: auto;
      }
      .dpad-group {
        display: none;
      }
    }

    @media (max-width: 859px) {
      .key-legend {
        display: none;
      }
      .level-pill {
        max-width: 150px;
      }
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(7, 18, 15, 0.72);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      z-index: 40;
      transition: opacity 0.25s ease;
    }

    .overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .modal-card {
      width: min(100%, 540px);
      background: linear-gradient(160deg, rgba(20, 48, 38, 0.97) 0%, rgba(11, 27, 22, 0.98) 100%);
      border: 1px solid rgba(246, 204, 99, 0.42);
      border-radius: 22px;
      padding: 24px 24px 22px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
      text-align: center;
    }

    .modal-title {
      font-family: 'Fredoka', 'Noto Sans TC', sans-serif;
      font-size: 1.75rem;
      font-weight: 700;
      margin: 0 0 8px;
      color: var(--gold);
      line-height: 1.2;
    }

    .modal-sub {
      font-size: 0.94rem;
      color: #d6e7dc;
      line-height: 1.55;
      margin: 0 0 18px;
    }

    .duo-preview {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin: 0 0 18px;
      flex-wrap: wrap;
    }

    .char-card {
      flex: 1;
      min-width: 195px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 16px;
      padding: 10px 12px;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .char-avatar {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .char-avatar svg, .char-avatar img {
      width: 52px;
      height: 52px;
      object-fit: contain;
      display: block;
    }

    .char-avatar.kodi {
      background: radial-gradient(circle at 50% 35%, rgba(169, 199, 108, 0.32), rgba(98, 115, 54, 0.25));
      border: 1px solid rgba(169, 199, 108, 0.55);
    }

    .char-avatar.gilly {
      background: radial-gradient(circle at 50% 35%, rgba(255, 198, 184, 0.34), rgba(242, 111, 109, 0.22));
      border: 1px solid rgba(255, 168, 152, 0.6);
    }

    .char-info h4 {
      margin: 0 0 2px;
      font-size: 0.94rem;
      font-weight: 700;
      color: #fff;
    }

    .char-info p {
      margin: 0;
      font-size: 0.78rem;
      color: var(--text-muted);
      line-height: 1.38;
    }

    .btn-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn-primary {
      appearance: none;
      border: none;
      background: linear-gradient(135deg, #f6cc63 0%, #e09f3e 100%);
      color: #1c1608;
      font-family: 'Fredoka', 'Noto Sans TC', sans-serif;
      font-weight: 700;
      font-size: 1.02rem;
      padding: 11px 24px;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(224, 159, 62, 0.35);
      transition: transform 0.12s ease, filter 0.15s ease;
    }

    .btn-primary:hover {
      filter: brightness(1.07);
      transform: translateY(-1px);
    }

    .btn-primary:active {
      transform: translateY(1px);
    }

    .btn-secondary {
      appearance: none;
      border: 1px solid rgba(255, 255, 255, 0.24);
      background: rgba(255, 255, 255, 0.08);
      color: #f4f7f1;
      font-family: inherit;
      font-weight: 600;
      font-size: 0.9rem;
      padding: 10px 18px;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.16);
    }

    .level-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin: 0 0 18px;
    }

    .level-select-btn {
      appearance: none;
      text-align: left;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 12px;
      padding: 10px 12px;
      color: #fff;
      cursor: pointer;
      transition: border-color 0.15s ease, background 0.15s ease;
    }

    .level-select-btn:hover {
      border-color: var(--gold);
      background: rgba(246, 204, 99, 0.12);
    }

    .level-select-btn.completed {
      border-color: rgba(79, 209, 139, 0.55);
    }

    .level-select-btn .lv-num {
      font-size: 0.74rem;
      font-weight: 700;
      color: var(--gold);
      text-transform: uppercase;
    }

    .level-select-btn .lv-name {
      font-size: 0.9rem;
      font-weight: 700;
      margin-top: 2px;
    }

    .level-select-btn .lv-tag {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 3px;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="top-bar">
      <div class="brand-group">
        <div class="title-badge" id="uiTitle">Kodi &amp; Gilly</div>
        <div class="level-pill" id="uiLevelPill">1. The Mossy Gate</div>
      </div>

      <div class="status-group">
        <div class="stat-chip active-kodi" id="uiActiveChar">Kodi (Gilly on Shoulder)</div>
        <div class="stat-chip" id="uiGems">✦ 0 / 3</div>
        <button class="hud-btn" id="btnLevels" type="button">Levels</button>
        <button class="hud-btn" id="btnRestart" type="button">Reset</button>
        <button class="hud-btn" id="btnSound" type="button">🔊</button>
        <button class="hud-btn" id="btnLang" type="button">繁中</button>
      </div>
    </header>

    <main class="stage-wrap" id="stageWrap">
      <canvas id="gameCanvas"></canvas>
      <div class="hint-banner" id="uiHint"></div>

      <div class="overlay" id="overlayModal">
        <div class="modal-card" id="modalContent"></div>
      </div>
    </main>

    <footer class="bottom-bar">
      <div class="key-legend" id="uiKeyLegend"></div>

      <div class="touch-controls">
        <div class="dpad-group">
          <button class="ctrl-btn" id="touchLeft" type="button" aria-label="Left">◀</button>
          <button class="ctrl-btn" id="touchRight" type="button" aria-label="Right">▶</button>
          <button class="ctrl-btn" id="touchUp" type="button" aria-label="Jump or Swim Up">▲</button>
          <button class="ctrl-btn" id="touchDown" type="button" aria-label="Swim Down">▼</button>
        </div>
        <div class="action-group">
          <button class="ctrl-btn primary-act" id="touchAction" type="button">Release Gilly</button>
          <button class="ctrl-btn swap-act" id="touchSwap" type="button">Swap</button>
        </div>
      </div>
    </footer>
  </div>

      // =========================================================
      // Web Audio Synthesized Sound Effects
      // =========================================================
      const Sound = {
        ctx: null,
        muted: false,
        ensure() {
          if (this.muted) return null;
          if (!this.ctx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (AudioCtx) this.ctx = new AudioCtx();
          }
          if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume().catch(() => {});
          }
          return this.ctx;
        },
        tone(freq, dur, type = 'sine', vol = 0.12, slideTo = null, delay = 0) {
          const ctx = this.ensure();
          if (!ctx) return;
          const now = ctx.currentTime + delay;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, now);
          if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, now + dur);
          gain.gain.setValueAtTime(0.0001, now);
          gain.gain.linearRampToValueAtTime(vol, now + 0.015);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + dur + 0.02);
        },
        jump(isGilly) {
          if (isGilly) this.tone(420, 0.14, 'triangle', 0.1, 640);
          else this.tone(210, 0.16, 'triangle', 0.12, 340);
        },
        release() {
          this.tone(480, 0.1, 'sine', 0.11, 680, 0);
          this.tone(680, 0.12, 'sine', 0.1, 860, 0.06);
        },
        mount() {
          this.tone(540, 0.09, 'sine', 0.1, 720, 0);
          this.tone(720, 0.12, 'triangle', 0.11, 960, 0.07);
        },
        splash() {
          this.tone(280, 0.16, 'sine', 0.1, 140, 0);
          this.tone(520, 0.12, 'sine', 0.07, 780, 0.05);
        },
        lever() {
          this.tone(150, 0.28, 'sawtooth', 0.07, 110, 0);
          this.tone(440, 0.14, 'triangle', 0.11, 554, 0.08);
          this.tone(659, 0.22, 'sine', 0.11, 659, 0.16);
        },
        plate(on) {
          this.tone(on ? 330 : 260, 0.12, 'triangle', 0.09, on ? 440 : 210);
        },
        gem() {
          this.tone(659, 0.12, 'sine', 0.1, 659, 0);
          this.tone(880, 0.14, 'sine', 0.1, 880, 0.06);
          this.tone(1174, 0.22, 'sine', 0.09, 1174, 0.12);
        },
        win() {
          const notes = [523.25, 659.25, 783.99, 1046.5];
          notes.forEach((n, i) => this.tone(n, 0.28, 'triangle', 0.11, n, i * 0.09));
        }
      };

      // =========================================================
      // Game State
      // =========================================================
      const state = {
        lang: 'en',
        mode: 'menu',
        levelIndex: 0,
        levels: buildLevels(),
        completedLevels: new Set(),
        level: null,
        kodi: null,
        gilly: null,

        gillyPerched: true,

        keys: { left: false, right: false, up: false, down: false },

      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');

      let viewH = 540;

      function cloneLevel(idx) {
        return buildLevels()[idx];
      }

      function loadLevel(idx) {
        state.levelIndex = idx;
        state.level = cloneLevel(idx);
        const sp = state.level.spawn;
        state.kodi = {
          x: sp.x,
          y: sp.y,

          h: 62,
          vx: 0,
          vy: 0,
          facing: 1,
          onGround: false,
          walkPhase: 0,
          pushing: false
        };
        state.gilly = {
          x: sp.x - 2,
          y: sp.y - 11,
          w: 28,
          h: 20,
          vx: 0,
          vy: 0,
          facing: 1,
          onGround: false,
          inWater: false,
          swimPhase: 0
        };
        state.gillyPerched = true;
        state.activeChar = 'kodi';
        state.particles = [];
        state.tempHint = '';
        state.tempHintTimer = 0;

        state.fireflies = [];
        for (let i = 0; i < 34; i++) {
          state.fireflies.push({
            x: Math.random() * state.level.worldW,

          });

      }

      function showTempHint(msg, sec = 3.2) {
        state.tempHint = msg;
        state.tempHintTimer = sec;
        uiHint.textContent = msg;
      }

      function spawnParticles(x, y, color, count = 10, spread = 90) {
        for (let i = 0; i < count; i++) {
          const ang = Math.random() * Math.PI * 2;
          const spd = 20 + Math.random() * spread;
          state.particles.push({
            x,
            y,
            vx: Math.cos(ang) * spd,
            vy: Math.sin(ang) * spd - 35,
            life: 0.45 + Math.random() * 0.4,
            maxLife: 0.85,
            size: 2.5 + Math.random() * 3.5,
            color
          });
        }
      }

      // =========================================================
      // Physics & Collision Helpers
      // =========================================================
      function rectsOverlap(a, b) {
        return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
      }

      function getActiveSolids(forChar) {
        const list = [];
        for (const s of state.level.solids) list.push(s);
        for (const g of state.level.gates) {
          if (g.kind === 'bridge') {
            if (g.progress > 0.72) {
              list.push({ x: g.x, y: g.y, w: g.w, h: g.h, kind: 'bridge' });
            }
          } else {
            const curY = g.y + g.openOffsetY * g.progress;
            if (g.progress < 0.92) {
              list.push({ x: g.x, y: curY, w: g.w, h: g.h, kind: g.kind });
            }
          }
        }
        for (const b of state.level.blocks) {
          if (forChar !== 'block') {
            list.push({ x: b.x, y: b.y, w: b.w, h: b.h, kind: 'pushBlock', ref: b });
          }
        }
        return list;
      }

      function isInWater(rect) {
        const cx = rect.x + rect.w * 0.5;
        const cy = rect.y + rect.h * 0.6;
        for (const w of state.level.waters) {
          if (cx >= w.x && cx <= w.x + w.w && cy >= w.y && cy <= w.y + w.h) {
            return w;
          }
        }
        return null;
      }

      function resolveEntityPhysics(ent, dt, solids, isKodi) {
        ent.x += ent.vx * dt;
        if (isKodi) ent.pushing = false;

        for (const s of solids) {
          if (rectsOverlap(ent, s)) {
            if (isKodi && s.kind === 'pushBlock' && ent.onGround && Math.abs(ent.vx) > 5) {
              const b = s.ref;
              const pushDelta = ent.vx * dt * 0.68;
              const nextX = Math.max(b.minX, Math.min(b.maxX, b.x + pushDelta));
              const moved = Math.abs(nextX - b.x) > 0.05;
              b.x = nextX;
              s.x = nextX; // Keep solid collider synced so vertical pass never snaps Kodi on top!
              ent.pushing = true;
              if (ent.vx > 0) ent.x = b.x - ent.w;
              else ent.x = b.x + b.w;
              if (moved && Math.random() < 0.25) {
                spawnParticles(b.x + (ent.vx > 0 ? 4 : b.w - 4), b.y + b.h - 2, '#b9a98e', 1, 35);
              }
            } else {
              if (ent.vx > 0) ent.x = s.x - ent.w;
              else if (ent.vx < 0) ent.x = s.x + s.w;
              ent.vx = 0;
            }
          }
        }

        if (isKodi) {
          for (const w of state.level.waters) {
            const bridgeClosed = state.level.gates.some(
              (g) => g.kind === 'bridge' && g.progress > 0.72 && g.x <= w.x + 10 && g.x + g.w >= w.x + w.w - 10
            );
            if (!bridgeClosed && rectsOverlap(ent, { x: w.x + 6, y: w.y + 8, w: w.w - 12, h: w.h })) {
              const mid = w.x + w.w * 0.5;
              if (ent.x + ent.w * 0.5 < mid) ent.x = w.x - ent.w - 2;
              else ent.x = w.x + w.w + 2;
              ent.vx = 0;
              ent.vy = -180;
              Sound.splash();
              spawnParticles(ent.x + ent.w * 0.5, w.y + 4, '#8ceeff', 8, 70);
              showTempHint(t('kodiWaterTip'), 3.2);
            }
          }
        }

        ent.y += ent.vy * dt;
        ent.onGround = false;
        for (const s of solids) {
          if (rectsOverlap(ent, s)) {
            if (ent.vy >= 0) {
              ent.y = s.y - ent.h;
              ent.vy = 0;
              ent.onGround = true;
            } else if (ent.vy < 0) {
              ent.y = s.y + s.h;
              ent.vy = 0;
            }
          }
        }
      }

      // =========================================================
      // Actions: Release / Mount / Lever / Swap
      // =========================================================
      function getNearbyLever(ent) {
        const cx = ent.x + ent.w * 0.5;
        const cy = ent.y + ent.h * 0.5;
        for (const lv of state.level.levers) {
          const dist = Math.hypot(cx - lv.x, cy - (lv.y - 18));
          if (dist < 44) return lv;
        }
        return null;
      }

      function isGillyNearKodi() {
        const kx = state.kodi.x + state.kodi.w * 0.5;
        const ky = state.kodi.y + state.kodi.h * 0.5;
        const gx = state.gilly.x + state.gilly.w * 0.5;
        const gy = state.gilly.y + state.gilly.h * 0.5;
        return Math.hypot(kx - gx, ky - gy) < 78;
      }

      function handleAction() {
        if (state.mode !== 'playing') return;
        Sound.ensure();

        const activeEnt = state.activeChar === 'kodi' ? state.kodi : state.gilly;
        const nearLever = getNearbyLever(activeEnt);
        if (nearLever) {
          nearLever.active = !nearLever.active;
          Sound.lever();
          spawnParticles(nearLever.x, nearLever.y - 24, nearLever.color, 16, 110);
          updateHUD();
          return;
        }

        if (state.gillyPerched) {
          state.gillyPerched = false;
          state.activeChar = 'gilly';
          const dir = state.kodi.facing;
          state.gilly.x = state.kodi.x + (dir > 0 ? state.kodi.w - 4 : -state.gilly.w + 4);
          state.gilly.y = state.kodi.y + 10;
          state.gilly.vx = dir * 130;
          state.gilly.vy = -190;
          state.gilly.facing = dir;
          Sound.release();
          spawnParticles(state.gilly.x + 14, state.gilly.y + 10, '#ffb5a7', 10, 70);
          updateHUD();
          return;
        }

        if (isGillyNearKodi()) {
          state.gillyPerched = true;
          state.activeChar = 'kodi';
          Sound.mount();
          spawnParticles(state.kodi.x + state.kodi.w * 0.5, state.kodi.y + 12, '#ffd8a8', 12, 75);
          updateHUD();
          return;
        }

        handleSwap();
      }

      function handleSwap() {
        if (state.mode !== 'playing') return;
        if (state.gillyPerched) {
          handleAction();
          return;
        }
        state.activeChar = state.activeChar === 'kodi' ? 'gilly' : 'kodi';
        Sound.tone(state.activeChar === 'gilly' ? 620 : 320, 0.09, 'sine', 0.09);
        updateHUD();
      }

      // =========================================================
      // Main Simulation Update
      // =========================================================
      function update(dt) {
        state.time += dt;
        if (state.mode !== 'playing') return;

        if (state.tempHintTimer > 0) {
          state.tempHintTimer -= dt;
          if (state.tempHintTimer <= 0) {
            uiHint.textContent = I18N[state.lang].levels[state.levelIndex].hint;
          }
        }

        const kodi = state.kodi;
        const gilly = state.gilly;
        const solidsForKodi = getActiveSolids('kodi');
        const solidsForGilly = getActiveSolids('gilly');

        // ---- Update Kodi ----
        if (state.activeChar === 'kodi') {
          const move = (state.keys.right ? 1 : 0) - (state.keys.left ? 1 : 0);
          kodi.vx = move * 225;
          if (move !== 0) {
            kodi.facing = move;
            kodi.walkPhase += dt * 11;
          } else {
            kodi.walkPhase = 0;
          }
          if (state.keys.up && kodi.onGround) {
            kodi.vy = -535;
            kodi.onGround = false;
            Sound.jump(false);
            spawnParticles(kodi.x + kodi.w * 0.5, kodi.y + kodi.h, '#9cc48e', 5, 55);
          }
        } else {
          kodi.vx *= 0.8;
          if (Math.abs(kodi.vx) < 4) kodi.vx = 0;
        }
        kodi.vy = Math.min(820, kodi.vy + 1250 * dt);
        resolveEntityPhysics(kodi, dt, solidsForKodi, true);

        // ---- Update Gilly ----
        if (state.gillyPerched) {
          // Rest Gilly higher and slightly forward on Kodi's upper shoulder so both faces stay clearly visible!
          const bob = Math.sin(kodi.walkPhase * 2) * (Math.abs(kodi.vx) > 5 ? 2.2 : 0.7);
          if (kodi.facing > 0) {
            gilly.x = kodi.x - 2;
          } else {
            gilly.x = kodi.x + kodi.w - gilly.w + 2;
          }
          gilly.y = kodi.y - 11 + bob;
          gilly.facing = kodi.facing;
          gilly.vx = 0;
          gilly.vy = 0;
          gilly.inWater = false;
        } else {
          const wasInWater = gilly.inWater;
          const waterZone = isInWater(gilly);
          gilly.inWater = !!waterZone;

          if (gilly.inWater && !wasInWater) {
            Sound.splash();
            spawnParticles(gilly.x + gilly.w * 0.5, waterZone.y + 4, '#9df2ff', 10, 80);
          }

          if (state.activeChar === 'gilly') {
            const mx = (state.keys.right ? 1 : 0) - (state.keys.left ? 1 : 0);
            const my = (state.keys.down ? 1 : 0) - (state.keys.up ? 1 : 0);
            if (mx !== 0) gilly.facing = mx;

            if (gilly.inWater) {
              gilly.vx += (mx * 210 - gilly.vx) * Math.min(1, dt * 10);
              gilly.vy += (my * 205 - gilly.vy) * Math.min(1, dt * 10);
              gilly.swimPhase += dt * (Math.hypot(gilly.vx, gilly.vy) > 20 ? 11 : 4);
              if (state.keys.up && gilly.y <= waterZone.y + 10) {
                gilly.vy = -345;
                Sound.splash();
              }
              if (Math.random() < dt * 7) {
                state.particles.push({
                  x: gilly.x + gilly.w * 0.5 + (Math.random() - 0.5) * 12,
                  y: gilly.y + 4,
                  vx: (Math.random() - 0.5) * 14,
                  vy: -35 - Math.random() * 25,
                  life: 0.65,
                  maxLife: 0.65,
                  size: 2.5 + Math.random() * 2,
                  color: 'rgba(205, 250, 255, 0.85)'
                });
              }
            } else {
              gilly.vx = mx * 185;
              if (mx !== 0) gilly.swimPhase += dt * 13;
              if (state.keys.up && gilly.onGround) {
                gilly.vy = -385;
                gilly.onGround = false;
                Sound.jump(true);
              }
              gilly.vy = Math.min(720, gilly.vy + 1250 * dt);
            }
          } else {
            gilly.vx *= 0.82;
            if (gilly.inWater) {
              gilly.vy *= 0.85;
              gilly.swimPhase += dt * 3;
            } else {
              gilly.vy = Math.min(720, gilly.vy + 1250 * dt);
            }
          }
          resolveEntityPhysics(gilly, dt, solidsForGilly, false);
        }

        // ---- Pressure Plates ----
        for (const p of state.level.plates) {
          const prev = p.active;
          const plateBox = { x: p.x, y: p.y - 6, w: p.w, h: p.h + 8 };
          let pressed = rectsOverlap(kodi, plateBox) || (!state.gillyPerched && rectsOverlap(gilly, plateBox));
          if (!pressed) {
            for (const b of state.level.blocks) {
              if (rectsOverlap(b, plateBox)) {
                pressed = true;
                break;
              }
            }
          }
          p.active = pressed;
          if (p.active !== prev) {
            Sound.plate(p.active);
            spawnParticles(p.x + p.w * 0.5, p.y, p.color, 8, 65);
          }
        }

        // ---- Update Gates & Bridges ----
        for (const g of state.level.gates) {
          let triggered = false;
          for (const lv of state.level.levers) {
            if (lv.targetId === g.id && lv.active) triggered = true;
          }
          for (const p of state.level.plates) {
            if (p.targetId === g.id && p.active) triggered = true;
          }
          const targetProg = triggered ? 1 : 0;
          const speed = 2.2;
          if (g.progress < targetProg) g.progress = Math.min(1, g.progress + speed * dt);
          else if (g.progress > targetProg) g.progress = Math.max(0, g.progress - speed * dt);
        }

        // ---- Collect Sun Gems ----
        for (const gem of state.level.gems) {
          if (gem.collected) continue;
          const gBox = { x: gem.x - 14, y: gem.y - 14, w: 28, h: 28 };
          if (rectsOverlap(kodi, gBox) || rectsOverlap(gilly, gBox)) {
            gem.collected = true;
            Sound.gem();
            spawnParticles(gem.x, gem.y, '#ffe073', 16, 110);
            updateHUD();
          }
        }

        // ---- Check Exit Portal ----
        const ex = state.level.exit;
        const exitBox = { x: ex.x - 34, y: ex.y - 96, w: 68, h: 96 };
        if (rectsOverlap(kodi, exitBox)) {
          if (state.gillyPerched || isGillyNearKodi()) {
            state.gillyPerched = true;
            state.completedLevels.add(state.levelIndex);
            Sound.win();
            spawnParticles(ex.x, ex.y - 50, '#ffd86b', 32, 160);
            if (state.levelIndex < state.levels.length - 1) state.mode = 'levelWin';
            else state.mode = 'victory';
            renderModal();
          } else {
            showTempHint(t('reuniteTip'), 2.6);
          }
        }

        // ---- Update Particles ----
        for (let i = state.particles.length - 1; i >= 0; i--) {
          const p = state.particles[i];
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.life -= dt;
          if (p.life <= 0) state.particles.splice(i, 1);
        }

        // ---- Smooth Camera Follow ----
        const focus = state.activeChar === 'kodi' ? kodi : gilly;
        const targetCamX = Math.max(
          0,
          Math.min(state.level.worldW - viewW, focus.x + focus.w * 0.5 - viewW * 0.48)
        );
        state.camera.x += (targetCamX - state.camera.x) * Math.min(1, dt * 6.5);

        updateActionButton();
      }

      function updateActionButton() {
        const activeEnt = state.activeChar === 'kodi' ? state.kodi : state.gilly;
        if (getNearbyLever(activeEnt)) touchAction.textContent = t('actLever');
        else if (state.gillyPerched) touchAction.textContent = t('actRelease');
        else if (isGillyNearKodi()) touchAction.textContent = t('actMount');
        else touchAction.textContent = t('actSwap');
        touchSwap.textContent = t('actSwap');
      }

      // =========================================================
      // Upgraded Storybook Jungle Ruins Illustration Engine
      // =========================================================
      function drawBackground() {
        const th = state.level.theme;
        if (ART.ready.bg) {
          // Seamless mirrored parallax tiling of painted jungle ruins backdrop
          const img = ART.bg;
          const drawH = Math.max(viewH, 520);
          const drawW = drawH * (img.naturalWidth / img.naturalHeight);
          const scrollX = (state.camera.x * 0.22) % (drawW * 2);
          const startTile = Math.floor(scrollX / drawW) - 1;
          for (let i = startTile; i <= startTile + 3; i++) {
            const x = i * drawW - scrollX;
            ctx.save();
            if (Math.abs(i) % 2 === 1) {
              ctx.translate(x + drawW, 0);
              ctx.scale(-1, 1);
              ctx.drawImage(img, 0, 0, drawW + 1, drawH);
            } else {
              ctx.drawImage(img, x, 0, drawW + 1, drawH);
            }
            ctx.restore();
          }

          // Subtle atmospheric tint per chamber so gameplay platforms pop cleanly
          const wash = ctx.createLinearGradient(0, 0, 0, viewH);
          if (th === 'golden') {
            wash.addColorStop(0, 'rgba(34, 28, 18, 0.36)');
            wash.addColorStop(0.6, 'rgba(42, 48, 28, 0.22)');
            wash.addColorStop(1, 'rgba(14, 24, 18, 0.54)');
          } else if (th === 'aqueduct') {
            wash.addColorStop(0, 'rgba(10, 34, 38, 0.38)');
            wash.addColorStop(0.6, 'rgba(16, 52, 54, 0.22)');
            wash.addColorStop(1, 'rgba(8, 24, 26, 0.54)');
          } else if (th === 'waterfall') {
            wash.addColorStop(0, 'rgba(12, 34, 28, 0.32)');
            wash.addColorStop(0.6, 'rgba(18, 48, 38, 0.2)');
            wash.addColorStop(1, 'rgba(10, 24, 20, 0.5)');
          } else {
            wash.addColorStop(0, 'rgba(14, 32, 24, 0.26)');
            wash.addColorStop(0.6, 'rgba(18, 42, 30, 0.18)');
            wash.addColorStop(1, 'rgba(10, 24, 18, 0.48)');
          }
          ctx.fillStyle = wash;
          ctx.fillRect(0, 0, viewW, viewH);
        } else {
          const grad = ctx.createLinearGradient(0, 0, 0, viewH);
          grad.addColorStop(0, '#143326');
          grad.addColorStop(0.55, '#275943');
          grad.addColorStop(1, '#10261b');
          ctx.fillStyle = grad;
          ctx.fillRect(0, 0, viewW, viewH);
        }

        // Animated golden sunbeams drifting softly across the painted ruins
        ctx.save();
        for (let i = 0; i < 4; i++) {
          const sx = ((i * 340 - state.camera.x * 0.14 + Math.sin(state.time * 0.4 + i) * 16) % (viewW + 320)) - 90;
          const beam = ctx.createLinearGradient(sx, 0, sx + 140, viewH);
          beam.addColorStop(0, th === 'golden' ? 'rgba(255, 224, 138, 0.16)' : 'rgba(235, 255, 204, 0.11)');
          beam.addColorStop(1, 'rgba(235, 255, 204, 0)');
          ctx.fillStyle = beam;
          ctx.beginPath();
          ctx.moveTo(sx, 0);
          ctx.lineTo(sx + 78, 0);
          ctx.lineTo(sx + 230, viewH);
          ctx.lineTo(sx + 95, viewH);
          ctx.closePath();
          ctx.fill();
        }
        ctx.restore();

        // Swaying overhead hanging vines (parallax 0.42)
        ctx.save();
        for (let i = -1; i < 8; i++) {
          const tx = i * 260 - ((state.camera.x * 0.42) % 260);
          const sway = Math.sin(state.time * 1.3 + i * 1.4) * 9;
          const vineLen = 88 + (Math.abs(i) % 3) * 32;
          ctx.strokeStyle = 'rgba(42, 98, 60, 0.62)';
          ctx.lineWidth = 2.4;
          ctx.beginPath();
          ctx.moveTo(tx + 95, 0);
          ctx.quadraticCurveTo(tx + 95 + sway, vineLen * 0.55, tx + 95 + sway * 1.35, vineLen);
          ctx.stroke();
          ctx.fillStyle = i % 2 === 0 ? 'rgba(255, 198, 168, 0.78)' : 'rgba(255, 230, 138, 0.78)';
          ctx.beginPath();
          ctx.arc(tx + 95 + sway * 1.35, vineLen, 2.8, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }

      function drawWorldDecor() {
        const list = state.level.decor || [];
        for (const d of list) {
          ctx.save();
          if (d.type === 'waterfall') {
            const grad = ctx.createLinearGradient(d.x, d.y, d.x, d.y + d.h);
            grad.addColorStop(0, 'rgba(130, 232, 240, 0.16)');
            grad.addColorStop(0.5, 'rgba(105, 218, 232, 0.28)');
            grad.addColorStop(1, 'rgba(185, 248, 255, 0.42)');
            ctx.fillStyle = grad;
            ctx.fillRect(d.x, d.y, d.w, d.h);
            // Animated falling streaks
            ctx.strokeStyle = 'rgba(220, 252, 255, 0.45)';
            ctx.lineWidth = 2;
            for (let i = 0; i < 4; i++) {
              const sx = d.x + 10 + i * (d.w - 20) / 3;
              const offset = (state.time * 160 + i * 75) % 80;
              for (let sy = offset - 80; sy < d.h; sy += 80) {
                ctx.beginPath();
                ctx.moveTo(sx, Math.max(0, sy));
                ctx.lineTo(sx, Math.min(d.h, sy + 36));
                ctx.stroke();
              }
            }
            // Mist clouds at base
            ctx.fillStyle = 'rgba(215, 250, 255, 0.24)';
            for (let m = 0; m < 4; m++) {
              const mx = d.x + 8 + m * (d.w / 3.5);
              const r = 14 + Math.sin(state.time * 3 + m) * 3;
              ctx.beginPath();
              ctx.arc(mx, d.y + d.h - 4, r, 0, Math.PI * 2);
              ctx.fill();
            }
          } else if (d.type === 'pillar') {
            // Weathered carved background stone column
            const px = d.x - 20;
            const py = d.y - d.h;
            const colGrad = ctx.createLinearGradient(px, py, px + 40, py);
            colGrad.addColorStop(0, '#3a4b41');
            colGrad.addColorStop(0.5, '#4d6155');
            colGrad.addColorStop(1, '#2b3830');
            ctx.fillStyle = colGrad;
            ctx.fillRect(px, py, 40, d.h);
            // Capital & base
            ctx.fillStyle = '#566b5e';
            ctx.fillRect(px - 6, py, 52, 14);
            ctx.fillRect(px - 5, d.y - 12, 50, 12);
            // Carved ancient geometric bands
            ctx.strokeStyle = 'rgba(22, 34, 27, 0.45)';
            ctx.lineWidth = 1.5;
            for (let ry = py + 30; ry < d.y - 20; ry += 36) {
              ctx.strokeRect(px + 6, ry, 28, 16);
            }
            // Moss drape
            ctx.fillStyle = '#4e9158';
            ctx.fillRect(px - 6, py, 52, 5);
          } else if (d.type === 'torch') {
            // Ancient stone brazier with warm flickering flame
            ctx.fillStyle = '#4f5e54';
            ctx.fillRect(d.x - 7, d.y - 34, 14, 34);
            ctx.fillStyle = '#66786c';
            ctx.beginPath();
            ctx.moveTo(d.x - 13, d.y - 34);
            ctx.lineTo(d.x + 13, d.y - 34);
            ctx.lineTo(d.x + 9, d.y - 24);
            ctx.lineTo(d.x - 9, d.y - 24);
            ctx.closePath();
            ctx.fill();
            // Warm glow
            const flick = Math.sin(state.time * 12 + d.x) * 2.5;
            const glow = ctx.createRadialGradient(d.x, d.y - 42, 2, d.x, d.y - 42, 46 + flick);
            glow.addColorStop(0, 'rgba(255, 206, 96, 0.45)');
            glow.addColorStop(1, 'rgba(255, 160, 60, 0)');
            ctx.fillStyle = glow;
            ctx.beginPath();
            ctx.arc(d.x, d.y - 42, 46 + flick, 0, Math.PI * 2);
            ctx.fill();
            // Flame
            ctx.fillStyle = '#ff9838';
            ctx.beginPath();
            ctx.moveTo(d.x - 6, d.y - 34);
            ctx.quadraticCurveTo(d.x - 2, d.y - 52 - flick * 0.6, d.x, d.y - 52 - flick);
            ctx.quadraticCurveTo(d.x + 6, d.y - 44, d.x + 6, d.y - 34);
            ctx.closePath();
            ctx.fill();
            ctx.fillStyle = '#fff0a8';
            ctx.beginPath();
            ctx.arc(d.x, d.y - 38, 3.2, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.restore();
        }
      }

      function drawStoneBlock(s) {
        ctx.save();
        // Weathered temple stone with warm top-edge highlight & rich shadow
        const grad = ctx.createLinearGradient(s.x, s.y, s.x, s.y + s.h);
        if (s.kind === 'ruinWall') {
          grad.addColorStop(0, '#617065');
          grad.addColorStop(0.5, '#4b5950');
          grad.addColorStop(1, '#344039');
        } else {
          grad.addColorStop(0, '#728273');
          grad.addColorStop(0.4, '#59675b');
          grad.addColorStop(1, '#3b463e');
        }
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.roundRect(s.x, s.y, s.w, s.h, s.kind === 'ledge' ? 6 : 3);
        ctx.fill();

        // Ashlar stonework courses + bevel highlights
        ctx.strokeStyle = 'rgba(20, 30, 24, 0.42)';
        ctx.lineWidth = 1.4;
        ctx.strokeRect(s.x + 0.7, s.y + 0.7, s.w - 1.4, s.h - 1.4);

        const rowH = 30;
        for (let row = rowH, rIdx = 0; row < s.h; row += rowH, rIdx++) {
          ctx.strokeStyle = 'rgba(18, 28, 22, 0.36)';
          ctx.beginPath();
          ctx.moveTo(s.x, s.y + row);
          ctx.lineTo(s.x + s.w, s.y + row);
          ctx.stroke();

          ctx.strokeStyle = 'rgba(215, 232, 212, 0.1)';
          ctx.beginPath();
          ctx.moveTo(s.x + 2, s.y + row + 1.5);
          ctx.lineTo(s.x + s.w - 2, s.y + row + 1.5);
          ctx.stroke();

          const offset = (rIdx % 2) * 26;
          ctx.strokeStyle = 'rgba(18, 28, 22, 0.32)';
          for (let col = 48 - offset; col < s.w; col += 52) {
            if (col <= 4) continue;
            ctx.beginPath();
            ctx.moveTo(s.x + col, s.y + row - rowH);
            ctx.lineTo(s.x + col, s.y + row);
            ctx.stroke();
          }
        }

        // Subtle ancient carved spiral motif on ruinWalls
        if (s.kind === 'ruinWall' && s.w >= 60 && s.h >= 120) {
          ctx.strokeStyle = 'rgba(205, 226, 198, 0.14)';
          ctx.lineWidth = 2;
          const cx = s.x + s.w * 0.5;
          for (let cy = s.y + 52; cy < s.y + s.h - 32; cy += 68) {
            ctx.strokeRect(cx - 14, cy - 14, 28, 28);
            ctx.strokeRect(cx - 7, cy - 7, 14, 14);
          }
        }

        // Lush layered moss carpet & tiny ferns on walkable tops
        if (s.kind !== 'wall') {
          ctx.fillStyle = '#3f7d4b';
          ctx.fillRect(s.x, s.y, s.w, 10);
          ctx.fillStyle = '#62b368';
          ctx.fillRect(s.x, s.y, s.w, 5);
          ctx.fillStyle = '#92d682';
          ctx.fillRect(s.x + 2, s.y, s.w - 4, 2);

          // Scalloped moss drapes & occasional grass blades
          for (let mx = s.x + 12; mx < s.x + s.w - 10; mx += 22) {
            const drop = 4 + ((mx * 13) % 7);
            ctx.fillStyle = '#478b53';
            ctx.beginPath();
            ctx.arc(mx, s.y + 9, drop, 0, Math.PI);
            ctx.fill();
            if ((mx * 7) % 3 === 0) {
              ctx.strokeStyle = '#79cc76';
              ctx.lineWidth = 1.6;
              ctx.beginPath();
              ctx.moveTo(mx, s.y);
              ctx.quadraticCurveTo(mx - 3, s.y - 6, mx - 6, s.y - 8);
              ctx.moveTo(mx + 2, s.y);
              ctx.quadraticCurveTo(mx + 5, s.y - 5, mx + 8, s.y - 6);
              ctx.stroke();
            }
          }
        }
        ctx.restore();
      }

      function drawRuneLinks() {
        for (const lk of state.level.links) {
          const gate = state.level.gates.find((g) => g.id === lk.targetId);
          const active = gate && gate.progress > 0.25;
          ctx.save();
          ctx.strokeStyle = active ? gate.color : 'rgba(255, 255, 255, 0.16)';
          ctx.lineWidth = active ? 3.2 : 2;
          ctx.setLineDash([7, 7]);
          ctx.lineDashOffset = -state.time * (active ? 28 : 6);
          ctx.beginPath();
          ctx.moveTo(lk.from.x, lk.from.y);
          ctx.lineTo(lk.from.x, Math.max(lk.from.y, lk.to.y) + 22);
          ctx.lineTo(lk.to.x, Math.max(lk.from.y, lk.to.y) + 22);
          ctx.lineTo(lk.to.x, lk.to.y);
          ctx.stroke();
          ctx.restore();
        }
      }

      function drawGatesAndBridges() {
        for (const g of state.level.gates) {
          ctx.save();
          if (g.kind === 'bridge') {
            if (g.progress < 0.05) {
              ctx.fillStyle = '#7d5a38';
              ctx.fillRect(g.x + g.w - 16, g.y - 110, 16, 110);
              ctx.strokeStyle = g.color;
              ctx.lineWidth = 2;
              ctx.strokeRect(g.x + g.w - 16, g.y - 110, 16, 110);
            } else {
              const curW = g.w * g.progress;
              const startX = g.x + g.w - curW;
              const bGrad = ctx.createLinearGradient(0, g.y, 0, g.y + g.h);
              bGrad.addColorStop(0, '#c0905b');
              bGrad.addColorStop(0.4, '#8b633c');
              bGrad.addColorStop(1, '#5c3f24');
              ctx.fillStyle = bGrad;
              ctx.fillRect(startX, g.y, curW, g.h);
              ctx.strokeStyle = 'rgba(38, 22, 10, 0.5)';
              ctx.lineWidth = 2;
              for (let px = startX + 24; px < g.x + g.w; px += 28) {
                ctx.beginPath();
                ctx.moveTo(px, g.y);
                ctx.lineTo(px, g.y + g.h);
                ctx.stroke();
              }
              ctx.fillStyle = g.color;
              ctx.fillRect(startX + 4, g.y + g.h - 5, Math.max(0, curW - 8), 3);
            }
          } else if (g.kind === 'grate') {
            const curY = g.y + g.openOffsetY * g.progress;
            ctx.fillStyle = '#364b54';
            ctx.fillRect(g.x, curY, g.w, g.h);
            ctx.strokeStyle = g.color;
            ctx.lineWidth = 2;
            ctx.strokeRect(g.x, curY, g.w, g.h);
            for (let bx = g.x + 8; bx < g.x + g.w; bx += 8) {
              ctx.beginPath();
              ctx.moveTo(bx, curY);
              ctx.lineTo(bx, curY + g.h);
              ctx.stroke();
            }
          } else {
            const curY = g.y + g.openOffsetY * g.progress;
            const gGrad = ctx.createLinearGradient(g.x, curY, g.x + g.w, curY);
            gGrad.addColorStop(0, '#3e4c46');
            gGrad.addColorStop(0.5, '#596b62');
            gGrad.addColorStop(1, '#37443e');
            ctx.fillStyle = gGrad;
            ctx.fillRect(g.x, curY, g.w, g.h);
            ctx.strokeStyle = g.color;
            ctx.lineWidth = 2.4;
            ctx.strokeRect(g.x + 1, curY + 1, g.w - 2, g.h - 2);
            // Carved glowing diamond rune
            ctx.fillStyle = g.color;
            ctx.beginPath();
            ctx.moveTo(g.x + g.w * 0.5, curY + g.h * 0.5 - 15);
            ctx.lineTo(g.x + g.w * 0.5 + 9, curY + g.h * 0.5);
            ctx.lineTo(g.x + g.w * 0.5, curY + g.h * 0.5 + 15);
            ctx.lineTo(g.x + g.w * 0.5 - 9, curY + g.h * 0.5);
            ctx.closePath();
            ctx.fill();
          }
          ctx.restore();
        }
      }

      function drawLeversAndPlates() {
        for (const lv of state.level.levers) {
          ctx.save();
          ctx.fillStyle = '#56665c';
          ctx.beginPath();
          ctx.roundRect(lv.x - 16, lv.y - 11, 32, 11, 4);
          ctx.fill();
          const ang = lv.active ? 0.58 : -0.58;
          ctx.translate(lv.x, lv.y - 10);
          ctx.rotate(ang);
          ctx.strokeStyle = '#d4b483';
          ctx.lineWidth = 5;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.lineTo(0, -28);
          ctx.stroke();
          // Glowing crystal orb handle
          ctx.fillStyle = lv.active ? lv.color : '#c2cec6';
          ctx.beginPath();
          ctx.arc(0, -30, 7.5, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = 'rgba(255, 255, 255, 0.65)';
          ctx.beginPath();
          ctx.arc(-2, -32, 2.3, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();

          const activeEnt = state.activeChar === 'kodi' ? state.kodi : state.gilly;
          if (getNearbyLever(activeEnt) === lv) {
            ctx.save();
            const bob = Math.sin(state.time * 6) * 3;
            ctx.fillStyle = 'rgba(12, 28, 23, 0.9)';
            ctx.strokeStyle = '#f6cc63';
            ctx.lineWidth = 1.6;
            ctx.beginPath();
            ctx.roundRect(lv.x - 16, lv.y - 70 + bob, 32, 22, 6);
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = '#ffefc2';
            ctx.font = '700 12px Inter, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('E', lv.x, lv.y - 55 + bob);
            ctx.restore();
          }
        }

        for (const p of state.level.plates) {
          ctx.save();
          const pressOffset = p.active ? 4 : 0;
          ctx.fillStyle = '#3b4a43';
          ctx.fillRect(p.x - 4, p.y + 4, p.w + 8, 6);
          ctx.fillStyle = p.active ? p.color : '#93aa9e';
          ctx.beginPath();
          ctx.roundRect(p.x, p.y + pressOffset, p.w, p.h - pressOffset * 0.5, 3);
          ctx.fill();
          ctx.restore();
        }

        for (const b of state.level.blocks) {
          ctx.save();
          const bGrad = ctx.createLinearGradient(b.x, b.y, b.x, b.y + b.h);
          bGrad.addColorStop(0, '#a38f73');
          bGrad.addColorStop(1, '#6f5e48');
          ctx.fillStyle = bGrad;
          ctx.beginPath();
          ctx.roundRect(b.x, b.y, b.w, b.h, 5);
          ctx.fill();
          ctx.strokeStyle = '#473a29';
          ctx.lineWidth = 2.4;
          ctx.stroke();
          // Carved sun emblem
          ctx.strokeStyle = '#f6cc63';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(b.x + b.w * 0.5, b.y + b.h * 0.5, 11, 0, Math.PI * 2);
          ctx.stroke();
          ctx.fillStyle = '#f6cc63';
          ctx.beginPath();
          ctx.arc(b.x + b.w * 0.5, b.y + b.h * 0.5, 3.5, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      }

      function drawGems() {
        for (const gem of state.level.gems) {
          if (gem.collected) continue;
          const bob = Math.sin(state.time * 4 + gem.x * 0.05) * 4.5;
          ctx.save();
          ctx.translate(gem.x, gem.y + bob);
          const glow = ctx.createRadialGradient(0, 0, 2, 0, 0, 22);
          glow.addColorStop(0, 'rgba(255, 226, 120, 0.62)');
          glow.addColorStop(1, 'rgba(255, 226, 120, 0)');
          ctx.fillStyle = glow;
          ctx.beginPath();
          ctx.arc(0, 0, 22, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#ffd95a';
          ctx.beginPath();
          ctx.moveTo(0, -12);
          ctx.lineTo(9.5, 0);
          ctx.lineTo(0, 12);
          ctx.lineTo(-9.5, 0);
          ctx.closePath();
          ctx.fill();
          ctx.fillStyle = '#fff8cf';
          ctx.beginPath();
          ctx.moveTo(0, -7.5);
          ctx.lineTo(4.5, -1);
          ctx.lineTo(0, 3.5);
          ctx.lineTo(-4.5, -1);
          ctx.closePath();
          ctx.fill();
          ctx.restore();
        }
      }

      function drawExitPortal() {
        const ex = state.level.exit;
        ctx.save();
        // Ornate carved stone archway
        const stoneGrad = ctx.createLinearGradient(ex.x - 48, ex.y - 118, ex.x + 48, ex.y);
        stoneGrad.addColorStop(0, '#728277');
        stoneGrad.addColorStop(1, '#445249');
        ctx.fillStyle = stoneGrad;
        ctx.fillRect(ex.x - 44, ex.y - 104, 18, 104);
        ctx.fillRect(ex.x + 26, ex.y - 104, 18, 104);
        ctx.beginPath();
        ctx.roundRect(ex.x - 52, ex.y - 122, 104, 22, 6);
        ctx.fill();
        // Moss on archway top
        ctx.fillStyle = '#5eb066';
        ctx.fillRect(ex.x - 50, ex.y - 122, 100, 6);
        // Golden sun medallion
        ctx.fillStyle = '#f6cc63';
        ctx.beginPath();
        ctx.arc(ex.x, ex.y - 110, 9.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#fff4be';
        ctx.beginPath();
        ctx.arc(ex.x - 2, ex.y - 112, 3, 0, Math.PI * 2);
        ctx.fill();
        // Shimmering portal curtain
        const pulse = 0.58 + Math.sin(state.time * 3.5) * 0.16;
        const pGrad = ctx.createLinearGradient(ex.x, ex.y - 100, ex.x, ex.y);
        pGrad.addColorStop(0, `rgba(250, 212, 106, ${pulse})`);
        pGrad.addColorStop(0.55, `rgba(79, 209, 139, ${pulse * 0.72})`);
        pGrad.addColorStop(1, 'rgba(79, 209, 139, 0.14)');
        ctx.fillStyle = pGrad;
        ctx.fillRect(ex.x - 26, ex.y - 100, 52, 100);
        ctx.restore();
      }

      function drawWater() {
        for (const w of state.level.waters) {
          ctx.save();
          const grad = ctx.createLinearGradient(0, w.y, 0, w.y + w.h);
          grad.addColorStop(0, 'rgba(74, 222, 224, 0.5)');
          grad.addColorStop(0.45, 'rgba(28, 146, 162, 0.68)');
          grad.addColorStop(1, 'rgba(12, 74, 92, 0.84)');
          ctx.fillStyle = grad;
          ctx.fillRect(w.x, w.y, w.w, w.h);

          // Dancing underwater caustic light shafts
          ctx.fillStyle = 'rgba(168, 250, 255, 0.08)';
          for (let cx = w.x + 25; cx < w.x + w.w - 30; cx += 65) {
            const shift = Math.sin(state.time * 2 + cx * 0.03) * 10;
            ctx.beginPath();
            ctx.moveTo(cx + shift, w.y);
            ctx.lineTo(cx + 22 + shift, w.y);
            ctx.lineTo(cx + 42 + shift * 0.6, w.y + w.h);
            ctx.lineTo(cx + 8 + shift * 0.6, w.y + w.h);
            ctx.closePath();
            ctx.fill();
          }

          // Floating lily pads on the surface
          for (let lx = w.x + 48; lx < w.x + w.w - 40; lx += 135) {
            const ly = w.y + Math.sin(state.time * 2.5 + lx * 0.05) * 2;
            ctx.fillStyle = '#4ba15c';
            ctx.beginPath();
            ctx.ellipse(lx, ly + 1, 14, 4.5, 0, 0.25, Math.PI * 1.9);
            ctx.fill();
          }

          // Shimmering wavy surface crest
          ctx.strokeStyle = 'rgba(205, 252, 255, 0.82)';
          ctx.lineWidth = 3;
          ctx.beginPath();
          for (let wx = w.x; wx <= w.x + w.w; wx += 14) {
            const wy = w.y + Math.sin(state.time * 3.2 + wx * 0.05) * 2.8;
            if (wx === w.x) ctx.moveTo(wx, wy);
            else ctx.lineTo(wx, wy);
          }
          ctx.stroke();
          ctx.restore();
        }
      }

      // High-detail Storybook Kodi (3D-illustrated sprite with animated bounce, tilt & push lean)
      function drawKodi(k) {
        ctx.save();
        const cx = k.x + k.w * 0.5;
        const cy = k.y + k.h;
        ctx.translate(cx, cy);
        ctx.scale(k.facing, 1);

        // Soft ground shadow
        ctx.fillStyle = 'rgba(0, 0, 0, 0.32)';
        ctx.beginPath();
        ctx.ellipse(0, 0, 19, 5, 0, 0, Math.PI * 2);
        ctx.fill();

        const walking = Math.abs(k.vx) > 8 && k.onGround;
        const hopY = walking ? -Math.abs(Math.sin(k.walkPhase)) * 3.8 : 0;
        const walkTilt = walking ? Math.sin(k.walkPhase) * 0.055 : (k.pushing ? 0.12 : 0);
        const breathe = Math.sin(state.time * 2.8) * 0.014;
        const jumpStretch = !k.onGround ? Math.max(-0.08, Math.min(0.1, -k.vy * 0.00018)) : 0;

        if (ART.ready.kodi) {
          ctx.save();
          ctx.translate(0, hopY);
          ctx.rotate(walkTilt);
          ctx.scale(1 - jumpStretch * 0.6, 1 + jumpStretch + breathe);
          const drawH = 74;
          const drawW = drawH * (ART.kodi.naturalWidth / ART.kodi.naturalHeight);
          ctx.drawImage(ART.kodi, -drawW * 0.5, -drawH + 2, drawW, drawH);
          ctx.restore();
        } else {
          // Fallback silhouette while loading
          ctx.fillStyle = '#627336';
          ctx.beginPath();
          ctx.roundRect(-16, -44, 32, 30, 10);
          ctx.fill();
          ctx.fillStyle = '#b4622b';
          ctx.beginPath();
          ctx.arc(0, -52, 14, 0, Math.PI * 2);
          ctx.fill();
        }

        // Active indicator arrow above Kodi
        if (state.activeChar === 'kodi') {
          ctx.fillStyle = '#f6cc63';
          const bob = Math.sin(state.time * 6) * 2.5;
          const arrowBase = state.gillyPerched ? -86 : -78;
          ctx.beginPath();
          ctx.moveTo(0, arrowBase + bob);
          ctx.lineTo(-5.5, arrowBase - 8 + bob);
          ctx.lineTo(5.5, arrowBase - 8 + bob);
          ctx.closePath();
          ctx.fill();
        }
        ctx.restore();
      }

      // High-detail Storybook Gilly (3D-illustrated axolotl sprite with crawl wiggle & swim glide)
      function drawGilly(g) {
        ctx.save();
        const cx = g.x + g.w * 0.5;
        const cy = g.y + g.h * 0.55;
        ctx.translate(cx, cy);
        ctx.scale(g.facing, 1);

        const moving = Math.hypot(g.vx, g.vy) > 12;
        const pitch = g.inWater
          ? Math.max(-0.45, Math.min(0.45, g.vy * 0.0018))
          : (moving && !state.gillyPerched ? Math.sin(g.swimPhase) * 0.06 : 0);
        const squash = moving ? Math.sin(g.swimPhase * 1.5) * 0.04 : Math.sin(state.time * 3.2) * 0.015;

        if (!g.inWater && !state.gillyPerched) {
          ctx.fillStyle = 'rgba(0, 0, 0, 0.24)';
          ctx.beginPath();
          ctx.ellipse(0, 9, 15, 3.2, 0, 0, Math.PI * 2);
          ctx.fill();
        }

        if (ART.ready.gilly) {
          ctx.save();
          ctx.rotate(pitch);
          ctx.scale(1 + squash, 1 - squash * 0.7);
          const drawW = state.gillyPerched ? 44 : 48;
          const drawH = drawW * (ART.gilly.naturalHeight / ART.gilly.naturalWidth);
          ctx.drawImage(ART.gilly, -drawW * 0.54, -drawH * 0.55, drawW, drawH);
          ctx.restore();
        } else {
          ctx.fillStyle = '#f9b9a7';
          ctx.beginPath();
          ctx.ellipse(0, 1, 13, 7, 0, 0, Math.PI * 2);
          ctx.fill();
        }

        // Active indicator arrow above Gilly when solo
        if (state.activeChar === 'gilly' && !state.gillyPerched) {
          ctx.fillStyle = '#ff9c8a';
          const bob = Math.sin(state.time * 6) * 2.5;
          ctx.beginPath();
          ctx.moveTo(4, -18 + bob);
          ctx.lineTo(-1, -24 + bob);
          ctx.lineTo(9, -24 + bob);
          ctx.closePath();
          ctx.fill();
        }
        ctx.restore();
      }

      function render() {
        ctx.clearRect(0, 0, viewW, viewH);
        if (!state.level) return;

        drawBackground();

        ctx.save();
        const scale = Math.min(1.15, Math.max(0.68, viewH / 600));
        const offsetY = viewH - 600 * scale;
        ctx.translate(0, offsetY);
        ctx.scale(scale, scale);
        ctx.translate(-state.camera.x, 0);

        drawWorldDecor();
        drawRuneLinks();
        for (const s of state.level.solids) drawStoneBlock(s);
        drawExitPortal();
        drawGatesAndBridges();
        drawLeversAndPlates();
        drawGems();

        // Draw Kodi first, then Gilly perched high on his upper shoulder so both faces are clearly visible
        drawKodi(state.kodi);
        drawGilly(state.gilly);

        drawWater();

        for (const f of state.fireflies) {
          const fx = f.x + Math.sin(state.time * f.speed + f.phase) * 18;
          const fy = f.y + Math.cos(state.time * f.speed * 0.8 + f.phase) * 12;
          const alpha = 0.3 + 0.55 * (0.5 + 0.5 * Math.sin(state.time * 3 + f.phase));
          ctx.fillStyle = `rgba(255, 232, 130, ${alpha})`;
          ctx.beginPath();
          ctx.arc(fx, fy, f.size, 0, Math.PI * 2);
          ctx.fill();
        }

        for (const p of state.particles) {
          ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;

        ctx.restore();

        // Subtle foreground jungle fern silhouettes at bottom corners (parallax 1.18)
        ctx.save();
        ctx.fillStyle = 'rgba(8, 22, 16, 0.52)';
        for (let i = 0; i < 5; i++) {
          const fx = ((i * 520 - state.camera.x * 1.18) % (viewW + 520) + (viewW + 520)) % (viewW + 520) - 160;
          ctx.beginPath();
          ctx.ellipse(fx, viewH + 8, 56, 20, -0.25, 0, Math.PI * 2);
          ctx.ellipse(fx + 32, viewH + 12, 48, 16, 0.3, 0, Math.PI * 2);
          ctx.fill();
        }
        // Soft cinematic edge vignette
        const vig = ctx.createRadialGradient(viewW * 0.5, viewH * 0.5, viewW * 0.32, viewW * 0.5, viewH * 0.5, viewW * 0.72);
        vig.addColorStop(0, 'rgba(0, 0, 0, 0)');
        vig.addColorStop(1, 'rgba(5, 14, 11, 0.34)');
        ctx.fillStyle = vig;
        ctx.fillRect(0, 0, viewW, viewH);
        ctx.restore();
      }

      // =========================================================
      // HUD & Modals
      // =========================================================
      function updateHUD() {
        document.title = t('title');
        uiTitle.textContent = t('shortTitle');
        btnLang.textContent = t('langBtn');
        btnLevels.textContent = t('levelsBtn');
        btnRestart.textContent = t('resetBtn');
        btnSound.textContent = Sound.muted ? '🔇' : '🔊';
        uiKeyLegend.innerHTML = t('legendHtml');

        const lvMeta = I18N[state.lang].levels[state.levelIndex];
        uiLevelPill.textContent = lvMeta.name;

        if (state.gillyPerched) {
          uiActiveChar.textContent = t('kodiPerched');
          uiActiveChar.className = 'stat-chip active-kodi';
        } else if (state.activeChar === 'kodi') {
          uiActiveChar.textContent = t('kodiSolo');
          uiActiveChar.className = 'stat-chip active-kodi';
        } else {
          uiActiveChar.textContent = t('gillySolo');
          uiActiveChar.className = 'stat-chip active-gilly';
        }

        const collected = state.level.gems.filter((g) => g.collected).length;
        uiGems.textContent = `✦ ${collected} / ${state.level.gems.length}`;

        if (state.tempHintTimer <= 0) {
          uiHint.textContent = lvMeta.hint;
        }
        updateActionButton();
      }

            <div class="btn-row">

          `;
          document.getElementById('modalPlayBtn').addEventListener('click', () => {
            Sound.ensure();
            loadLevel(0);
            state.mode = 'playing';
            renderModal();
          });
          document.getElementById('modalSelectBtn').addEventListener('click', () => {
            state.mode = 'levelSelect';
            renderModal();
          });
        } else if (state.mode === 'levelSelect') {
          const cards = I18N[state.lang].levels
            .map((lv, idx) => {
              const done = state.completedLevels.has(idx);
              return `
                <button class="level-select-btn ${done ? 'completed' : ''}" data-lv="${idx}" type="button">
                  <div class="lv-num">${done ? '✓ ' : ''}0${idx + 1}</div>
                  <div class="lv-name">${lv.name.replace(/^\d+\.\s*/, '')}</div>
                  <div class="lv-tag">${lv.tag}</div>
                </button>
              `;
            })
            .join('');
          modalContent.innerHTML = `
            <h2 class="modal-title">${t('selectLevelTitle')}</h2>
            <p class="modal-sub">${t('selectLevelSub')}</p>
            <div class="level-grid">${cards}</div>
            <div class="btn-row">
              <button class="btn-secondary" id="modalBackBtn" type="button">${t('backBtn')}</button>
            </div>
          `;
          modalContent.querySelectorAll('.level-select-btn').forEach((btn) => {
            btn.addEventListener('click', () => {
              Sound.ensure();
              loadLevel(Number(btn.dataset.lv));
              state.mode = 'playing';
              renderModal();
            });
          });
          document.getElementById('modalBackBtn').addEventListener('click', () => {
            state.mode = 'playing';
            renderModal();
          });
        } else if (state.mode === 'levelWin') {
          const collected = state.level.gems.filter((g) => g.collected).length;
          modalContent.innerHTML = `
            <h2 class="modal-title">${t('levelCompleteTitle')}</h2>
            <p class="modal-sub">${t('levelCompleteSub')}<br/><strong>${t('gemsCollected')}: ✦ ${collected} / ${state.level.gems.length}</strong></p>
            <div class="btn-row">
              <button class="btn-primary" id="modalNextBtn" type="button">${t('nextLevelBtn')}</button>
              <button class="btn-secondary" id="modalReplayBtn" type="button">${t('replayBtn')}</button>
            </div>
          `;
          document.getElementById('modalNextBtn').addEventListener('click', () => {
            loadLevel(state.levelIndex + 1);
            state.mode = 'playing';
            renderModal();
          });
          document.getElementById('modalReplayBtn').addEventListener('click', () => {
            loadLevel(state.levelIndex);
            state.mode = 'playing';
            renderModal();
          });
        } else if (state.mode === 'victory') {
          const collected = state.level.gems.filter((g) => g.collected).length;
          modalContent.innerHTML = `
            <h2 class="modal-title">✨ ${t('victoryTitle')} ✨</h2>
            <p class="modal-sub">${t('victorySub')}<br/><strong>${t('gemsCollected')}: ✦ ${collected} / ${state.level.gems.length}</strong></p>
            <div class="btn-row">
              <button class="btn-primary" id="modalAgainBtn" type="button">${t('playAgainBtn')}</button>
              <button class="btn-secondary" id="modalLvBtn" type="button">${t('chooseLevelBtn')}</button>

          document.getElementById('modalAgainBtn').addEventListener('click', () => {

            state.mode = 'levelSelect';
            renderModal();

      // =========================================================
      // Input Handling (Keyboard + Touch)
      // =========================================================
      window.addEventListener('keydown', (e) => {
        if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space', 'Tab'].includes(e.code)) {
          e.preventDefault();
        }
        if (state.mode !== 'playing') return;

        if (e.code === 'ArrowLeft' || e.code === 'KeyA') state.keys.left = true;
        if (e.code === 'ArrowRight' || e.code === 'KeyD') state.keys.right = true;
        if (e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Space') state.keys.up = true;
        if (e.code === 'ArrowDown' || e.code === 'KeyS') state.keys.down = true;

        if (!e.repeat) {
          if (e.code === 'KeyE' || e.code === 'Enter') handleAction();
          else if (e.code === 'Tab' || e.code === 'KeyQ') handleSwap();
          else if (e.code === 'KeyR') loadLevel(state.levelIndex);
        }
      });

      window.addEventListener('keyup', (e) => {
        if (e.code === 'ArrowLeft' || e.code === 'KeyA') state.keys.left = false;
        if (e.code === 'ArrowRight' || e.code === 'KeyD') state.keys.right = false;
        if (e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Space') state.keys.up = false;
        if (e.code === 'ArrowDown' || e.code === 'KeyS') state.keys.down = false;
      });

      function bindHoldButton(btn, keyName) {
        const start = (e) => {
          e.preventDefault();
          Sound.ensure();
          state.keys[keyName] = true;
          btn.classList.add('pressed');
        };
        const end = (e) => {
          e.preventDefault();
          state.keys[keyName] = false;
          btn.classList.remove('pressed');
        };
        btn.addEventListener('pointerdown', start);
        btn.addEventListener('pointerup', end);
        btn.addEventListener('pointerleave', end);
        btn.addEventListener('pointercancel', end);
      }

      bindHoldButton(touchLeft, 'left');
      bindHoldButton(touchRight, 'right');
      bindHoldButton(touchUp, 'up');
      bindHoldButton(touchDown, 'down');

      touchAction.addEventListener('click', handleAction);
      touchSwap.addEventListener('click', handleSwap);

      btnLevels.addEventListener('click', () => {
        state.mode = state.mode === 'levelSelect' ? 'playing' : 'levelSelect';
        renderModal();
      });

      btnRestart.addEventListener('click', () => {
        loadLevel(state.levelIndex);
        state.mode = 'playing';
        renderModal();
      });

      btnSound.addEventListener('click', () => {
        Sound.muted = !Sound.muted;
        updateHUD();
      });

      btnLang.addEventListener('click', () => {
        state.lang = state.lang === 'en' ? 'zh' : 'en';
        updateHUD();
        if (state.mode !== 'playing') renderModal();
      });

      // =========================================================
      // Resize & Main Loop
      // =========================================================
      function resizeCanvas() {
        const rect = stageWrap.getBoundingClientRect();
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        viewW = Math.max(320, Math.floor(rect.width));
        viewH = Math.max(240, Math.floor(rect.height));
        canvas.width = Math.floor(viewW * dpr);
        canvas.height = Math.floor(viewH * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        render();
      }

      function loop(ts) {
        if (!state.lastTs) state.lastTs = ts;
        const dt = Math.min(0.04, (ts - state.lastTs) / 1000);
        state.lastTs = ts;
        update(dt);
        render();
        state.rafId = window.requestAnimationFrame(loop);
      }

      window.addEventListener('resize', resizeCanvas);

      window.onload = function () {
        loadLevel(0);
        resizeCanvas();
        renderModal();
        if (state.rafId) window.cancelAnimationFrame(state.rafId);
        state.rafId = window.requestAnimationFrame(loop);
      };
    })();
  </script>
</body>
</html>
